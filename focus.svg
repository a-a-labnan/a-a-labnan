<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 96" width="1000" height="96" role="img" aria-labelledby="ft fd">
  <title id="ft">What I'm doing right now</title>
  <desc id="fd">Building Flutter clients that don't jank, shipping the FastAPI services behind them, designing the failure modes first.</desc>

  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16243f"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>

    <clipPath id="c0"><rect x="170" y="42" width="0" height="26">
      <animate attributeName="width" values="0;432;432;0;0" keyTimes="0;0.1167;0.25;0.3333;1" dur="12s" repeatCount="indefinite" calcMode="linear"/>
    </rect></clipPath>
    <clipPath id="c1"><rect x="170" y="42" width="0" height="26">
      <animate attributeName="width" values="0;0;400;400;0;0" keyTimes="0;0.3333;0.45;0.5833;0.6667;1" dur="12s" repeatCount="indefinite" calcMode="linear"/>
    </rect></clipPath>
    <clipPath id="c2"><rect x="170" y="42" width="0" height="26">
      <animate attributeName="width" values="0;0;356;356;0" keyTimes="0;0.6667;0.7833;0.9167;1" dur="12s" repeatCount="indefinite" calcMode="linear"/>
    </rect></clipPath>

    <filter id="fg" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="96" rx="10" fill="url(#tbg)"/>
  <rect x="0.5" y="0.5" width="999" height="95" rx="10" fill="none" stroke="#fca311" stroke-opacity="0.22"/>

  <!-- chrome -->
  <rect x="1" y="1" width="998" height="28" rx="9" fill="#ffffff" fill-opacity="0.04"/>
  <rect x="1" y="20" width="998" height="9" fill="#ffffff" fill-opacity="0.04"/>
  <circle cx="24" cy="15" r="5" fill="#ff5f57"/>
  <circle cx="42" cy="15" r="5" fill="#febc2e"/>
  <circle cx="60" cy="15" r="5" fill="#28c840"/>
  <text x="500" y="19" text-anchor="middle" font-family="Consolas, Monaco, Menlo, Courier New, monospace" font-size="11.5" letter-spacing="1.4" fill="#8a99b0">labnan@dhaka — now building</text>

  <!-- prompt -->
  <text x="24" y="62" font-family="Consolas, Monaco, Menlo, Courier New, monospace" font-size="18" fill="#fca311" font-weight="600">labnan<tspan fill="#5f7392">:~$</tspan></text>

  <!-- typed lines -->
  <g clip-path="url(#c0)">
    <text x="170" y="62" font-family="Consolas, Monaco, Menlo, Courier New, monospace" font-size="18" fill="#e8eef7">building Flutter clients that don't jank</text>
  </g>
  <g clip-path="url(#c1)">
    <text x="170" y="62" font-family="Consolas, Monaco, Menlo, Courier New, monospace" font-size="18" fill="#e8eef7">shipping FastAPI services behind them</text>
  </g>
  <g clip-path="url(#c2)">
    <text x="170" y="62" font-family="Consolas, Monaco, Menlo, Courier New, monospace" font-size="18" fill="#e8eef7">designing the failure modes first</text>
  </g>

  <!-- caret -->
  <rect x="170" y="44" width="10" height="22" fill="#fca311" fill-opacity="0.9" filter="url(#fg)">
    <animate attributeName="x"
      values="170;602;602;170;570;570;170;526;526;170"
      keyTimes="0;0.1167;0.25;0.3333;0.45;0.5833;0.6667;0.7833;0.9167;1"
      dur="12s" repeatCount="indefinite" calcMode="linear"/>
    <animate attributeName="opacity" values="1;1;0.15;0.15;1" dur="1.05s" repeatCount="indefinite" keyTimes="0;0.45;0.5;0.95;1"/>
  </rect>
</svg>
