<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 130" width="1000" height="130" role="img" aria-labelledby="it id">
  <title id="it">Impact at a glance</title>
  <desc id="id">2 apps live on Google Play, 1000-plus installs, 5 years in software, 13 API modules shipped solo.</desc>

  <defs>
    <linearGradient id="ibg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16243f"/>
      <stop offset="100%" stop-color="#0d1526"/>
    </linearGradient>
    <linearGradient id="ishine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fca311" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="ig" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="130" rx="10" fill="url(#ibg)"/>

  <!-- card 1 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="0.1s" dur="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0,14;0,0" begin="0.1s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    <rect x="16" y="16" width="230" height="98" rx="8" fill="#ffffff" fill-opacity="0.035" stroke="#fca311" stroke-opacity="0.22"/>
    <rect x="16" y="16" width="0" height="3" rx="1.5" fill="#fca311">
      <animate attributeName="width" values="0;230" begin="0.4s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text x="36" y="72" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#fca311" filter="url(#ig)">02</text>
    <text x="36" y="96" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" textLength="190" lengthAdjust="spacingAndGlyphs" fill="#c3cfe0">APPS LIVE ON GOOGLE PLAY</text>
  </g>

  <!-- card 2 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="0.28s" dur="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0,14;0,0" begin="0.28s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    <rect x="262" y="16" width="230" height="98" rx="8" fill="#ffffff" fill-opacity="0.035" stroke="#fca311" stroke-opacity="0.22"/>
    <rect x="262" y="16" width="0" height="3" rx="1.5" fill="#fca311">
      <animate attributeName="width" values="0;230" begin="0.58s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text x="282" y="72" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#fca311" filter="url(#ig)">1K+</text>
    <text x="282" y="96" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" textLength="190" lengthAdjust="spacingAndGlyphs" fill="#c3cfe0">INSTALLS ON ONE PLATFORM</text>
  </g>

  <!-- card 3 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="0.46s" dur="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0,14;0,0" begin="0.46s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    <rect x="508" y="16" width="230" height="98" rx="8" fill="#ffffff" fill-opacity="0.035" stroke="#fca311" stroke-opacity="0.22"/>
    <rect x="508" y="16" width="0" height="3" rx="1.5" fill="#fca311">
      <animate attributeName="width" values="0;230" begin="0.76s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text x="528" y="72" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#fca311" filter="url(#ig)">05</text>
    <text x="528" y="96" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" textLength="190" lengthAdjust="spacingAndGlyphs" fill="#c3cfe0">YEARS: 3 BREAKING, 2 BUILDING</text>
  </g>

  <!-- card 4 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="0.64s" dur="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0,14;0,0" begin="0.64s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    <rect x="754" y="16" width="230" height="98" rx="8" fill="#ffffff" fill-opacity="0.035" stroke="#fca311" stroke-opacity="0.22"/>
    <rect x="754" y="16" width="0" height="3" rx="1.5" fill="#fca311">
      <animate attributeName="width" values="0;230" begin="0.94s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text x="774" y="72" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#fca311" filter="url(#ig)">13</text>
    <text x="774" y="96" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" textLength="190" lengthAdjust="spacingAndGlyphs" fill="#c3cfe0">API MODULES SHIPPED SOLO</text>
  </g>

  <!-- sweep -->
  <rect x="-300" y="0" width="300" height="130" fill="url(#ishine)">
    <animateTransform attributeName="transform" type="translate" values="0,0;1400,0" dur="6s" begin="1.6s" repeatCount="indefinite"/>
  </rect>
</svg>
