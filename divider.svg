<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 16" width="1000" height="16" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="dbase" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fca311" stop-opacity="0"/>
      <stop offset="15%" stop-color="#fca311" stop-opacity="0.35"/>
      <stop offset="85%" stop-color="#fca311" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fca311" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dpulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fca311" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fca311" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fca311" stop-opacity="0"/>
    </linearGradient>
    <filter id="dglow" x="-60%" y="-300%" width="220%" height="700%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="7.5" width="1000" height="1" fill="url(#dbase)"/>

  <rect x="-220" y="7" width="220" height="2" fill="url(#dpulse)" filter="url(#dglow)">
    <animateTransform attributeName="transform" type="translate" values="0,0;1240,0" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <g fill="#fca311">
    <rect x="494" y="4" width="8" height="8" transform="rotate(45 498 8)">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
